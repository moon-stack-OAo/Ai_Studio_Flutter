<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Studio · Material 暗色 · 会话列表</title>
  <style>
    :root {
      --canvas: #0a0a0a;
      --surface: #141414;
      --surface-muted: #1c1c1c;
      --ink: #fafafa;
      --ink-secondary: #a1a1aa;
      --ink-muted: #71717a;
      --border: #27272a;
      --primary: #3b82f6;
      --primary-pressed: #2563eb;
      --on-primary: #ffffff;
      --danger: #f87171;
      --font: Roboto, "Noto Sans SC", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, "Roboto Mono", "Noto Sans Mono", "SF Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: #050505;
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    .phone {
      width: min(390px, 100%);
      height: min(844px, 92vh);
      background: var(--canvas);
      border-radius: 36px;
      border: 1px solid var(--border);
      box-shadow: 0 28px 64px rgba(0,0,0,.55);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .status {
      height: 44px;
      padding: 12px 22px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      background: var(--surface);
    }
    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 8px 0 4px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .icon-btn {
      width: 48px; height: 48px; border: 0; border-radius: 24px;
      background: transparent; color: var(--ink-secondary);
      display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
    }
    .icon-btn:hover, .icon-btn:active { background: var(--surface-muted); color: var(--ink); }
    .icon-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
    .icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .top-title { flex: 1; min-width: 0; }
    .top-title h1 { font-size: 18px; font-weight: 650; letter-spacing: 0; }
    .top-title .sub { font-size: 11px; color: var(--ink-muted); margin-top: 1px; }
    .badge-id {
      display: inline-block; font-size: 9px; color: var(--ink-muted);
      border: 1px dashed color-mix(in oklch, var(--border) 60%, #aaa);
      padding: 1px 5px; border-radius: 3px; font-family: var(--mono); vertical-align: middle;
    }
    .hint {
      margin: 10px 14px 0;
      padding: 10px 12px;
      border-radius: 12px;
      background: color-mix(in oklch, var(--primary) 12%, transparent);
      border: 1px solid color-mix(in oklch, var(--primary) 22%, var(--border));
      font-size: 12px; color: var(--ink-secondary); line-height: 1.45;
    }
    .list {
      flex: 1; overflow: auto; padding: 10px 10px 88px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .session {
      width: 100%; text-align: left; border: 0;
      background: var(--surface); border-radius: 14px;
      padding: 14px 14px; cursor: pointer; color: var(--ink);
      border: 1px solid transparent;
      min-height: 72px;
    }
    .session:hover, .session:active { background: var(--surface-muted); }
    .session.active {
      border-color: color-mix(in oklch, var(--primary) 40%, var(--border));
      background: color-mix(in oklch, var(--primary) 12%, transparent);
    }
    .session .t { font-size: 14px; font-weight: 600; letter-spacing: 0; }
    .session .d { font-size: 12px; color: var(--ink-muted); margin-top: 4px; display: flex; justify-content: space-between; gap: 8px; }
    .session.longpress {
      background: color-mix(in oklch, var(--primary) 16%, transparent);
      box-shadow: 0 0 0 2px color-mix(in oklch, var(--primary) 25%, transparent);
    }
    .sheet {
      position: absolute; left: 10px; right: 10px; bottom: 78px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 8px; box-shadow: 0 16px 40px rgba(0,0,0,.45);
      z-index: 4;
    }
    .sheet .title {
      font-size: 11px; color: var(--ink-muted); padding: 6px 10px 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .sheet button {
      width: 100%; text-align: left; border: 0; background: transparent;
      padding: 14px 12px; border-radius: 12px; font-size: 14px; color: var(--ink);
      cursor: pointer; min-height: 48px;
    }
    .sheet button:hover, .sheet button:active { background: var(--surface-muted); }
    .sheet button.danger { color: var(--danger); }
    .fab {
      position: absolute; right: 18px; bottom: 88px; z-index: 3;
      width: 56px; height: 56px; border: 0; border-radius: 16px;
      background: var(--primary); color: var(--on-primary);
      display: grid; place-items: center; cursor: pointer;
      box-shadow: 0 8px 20px color-mix(in oklch, var(--primary) 35%, transparent);
    }
    .fab:hover { background: var(--primary-pressed); }
    .fab:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .fab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; }
    .back-host {
      position: absolute; left: 14px; bottom: 88px; z-index: 3;
      font-size: 11px; color: var(--ink-muted);
      background: var(--surface); border: 1px dashed var(--border);
      padding: 6px 8px; border-radius: 8px; font-family: var(--mono);
    }
    .navbar {
      height: 64px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding-bottom: 8px;
    }
    a.nav-item { text-decoration: none; color: inherit; }
    .nav-item {
      border: 0; background: transparent; color: var(--ink-muted);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; font-size: 11px; cursor: pointer; min-height: 48px;
    }
    .nav-item svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.active { color: #93c5fd; }
    .home-indicator {
      position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
      width: 120px; height: 4px; border-radius: 4px; background: #fafafa; opacity: .25;
    }
    a.back {
      position: fixed; left: 18px; bottom: 14px; z-index: 20;
      font-size: 12px; color: var(--ink-secondary); text-decoration: none;
      background: var(--surface); border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px;
    }
    a.back:hover { color: var(--ink); }
    .corner-tag {
      position: fixed; right: 18px; bottom: 14px; z-index: 20;
      font-size: 10px; font-family: var(--mono); color: var(--ink-muted);
      background: var(--surface); border: 1px dashed var(--border); padding: 4px 8px; border-radius: 6px;
    }
  
/* thin scrollbars */
* { scrollbar-width: thin; scrollbar-color: color-mix(in oklch, var(--ink-muted, #71717a) 55%, transparent) transparent; }
*::-webkit-scrollbar { width: 6px; height: 6px; }
*::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: color-mix(in oklch, var(--ink-muted, #71717a) 45%, transparent);
  border-radius: 999px;
  border: 1px solid transparent;
  background-clip: padding-box;
}
*::-webkit-scrollbar-thumb:hover {
  background: color-mix(in oklch, var(--ink-muted, #71717a) 70%, transparent);
  background-clip: padding-box;
}
*::-webkit-scrollbar-corner { background: transparent; }
</style>
</head>
<body>
  <div class="phone" data-od-id="material-dark-sessions">
    <div class="status" data-od-id="m-safe-area">
      <span>9:41</span>
      <span>▌▌▌ · 100%</span>
    </div>
    <header class="topbar" data-od-id="m-top-app-bar">
      <a class="icon-btn" href="material-dark-chat.html" title="返回"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></a>
      <div class="top-title">
        <h1>会话</h1>
        <div class="sub">M-SessionList · CHAT-SESSION-LIST</div>
      </div>
      <button class="icon-btn" type="button" title="搜索" aria-label="搜索会话">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>
      </button>
    </header>

    <div class="hint">
      全屏列表层。系统返回 / 边缘滑动先关闭本层再离页。
      <span class="badge-id">M-BackHost · NAV-BACK</span>
    </div>

    <div class="list" data-od-id="m-session-list">
      <button class="session active" type="button">
        <div class="t">本地多模态客户端方案</div>
        <div class="d"><span>今天 · 流式中</span><span>grok-2</span></div>
      </button>
      <button class="session longpress" type="button">
        <div class="t">提供商兼容层设计</div>
        <div class="d"><span>昨天 · 长按示例</span><span>gpt-4.1-mini</span></div>
      </button>
      <button class="session" type="button">
        <div class="t">生图参数默认值</div>
        <div class="d"><span>周一</span><span>已归档</span></div>
      </button>
      <button class="session" type="button">
        <div class="t">安全 URL 策略核对</div>
        <div class="d"><span>上周</span><span>xAI</span></div>
      </button>
      <button class="session" type="button">
        <div class="t">空态文案：未配置 Key</div>
        <div class="d"><span>草稿</span><span>—</span></div>
      </button>
    </div>

    <div class="sheet" data-od-id="m-session-actions">
      <div class="title">长按操作 · CHAT-SESSION-LIST <span class="badge-id">编辑中</span></div>
      <button type="button">重命名</button>
      <button type="button">置顶</button>
      <button type="button" class="danger">删除会话…</button>
    </div>

    <button class="fab" type="button" aria-label="新建会话" data-od-id="m-session-fab" title="新建会话">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div class="back-host">M-SafeArea · 有层栈</div>

    <nav class="navbar" data-od-id="m-nav-bar" aria-label="主导航">
      <a class="nav-item active" href="material-dark-chat.html" aria-current="page">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v10H8l-4 3V6z"/></svg>
        对话
      </a>
      <a class="nav-item" href="material-dark-image.html">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4 16l5-4 4 3 3-2 4 3"/></svg>
        生图
      </a>
      <a class="nav-item" href="material-dark-video.html">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>
        生视频
      </a>
      <a class="nav-item" href="material-dark-settings.html">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        设置
      </a>
    </nav>
    <div class="home-indicator" aria-hidden="true"></div>
  </div>
  <a class="back" href="material-dark-chat.html">← 返回对话</a>
  <a class="back" style="left:130px" href="material-light-sessions.html">亮色会话</a>
  <a class="back" style="left:230px" href="index.html">总览</a>
  <div class="corner-tag">Material Dark · M-SessionList / FAB</div>
</body>
</html>
