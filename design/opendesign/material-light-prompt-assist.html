<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Studio · Material 亮色 · 提示词辅助</title>
<style>
:root {
  --canvas:#faf9f5; --surface:#ffffff; --surface-elevated:#efeeeb;
  --ink:#141413; --ink-secondary:#3d3d3a; --ink-muted:#6c6a64; --border:#e7e6e1;
  --primary:#d97757; --primary-pressed:#a9583e; --on-primary:#ffffff;
  --success:#3f6f4e; --danger:#b42318;
  --font: Roboto, "Noto Sans SC", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, "Roboto Mono", "Noto Sans Mono", "SF Mono", Consolas, monospace;
  --scrim: rgba(40, 32, 24, .45);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:#d8d4cb;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.phone{width:min(390px,100%);height:min(844px,92vh);background:var(--canvas);border-radius:36px;border:1px solid var(--border);box-shadow:0 28px 64px rgba(40,30,20,.18);overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{height:44px;padding:12px 22px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;background:var(--surface)}
.topbar{height:56px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar h1{font-size:17px;font-weight:650;letter-spacing:0}
.sub{font-size:11px;color:var(--ink-muted)}
.icon-btn{width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:var(--ink-secondary);display:grid;place-items:center;text-decoration:none}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.main{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px}
.label{font-size:11px;color:var(--ink-muted);font-weight:650;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.textarea{width:100%;border:1px solid var(--border);border-radius:10px;background:var(--surface-elevated);color:var(--ink);font:inherit;font-size:14px;padding:10px 12px;min-height:72px;resize:none}
.btn{height:48px;border:0;border-radius:12px;background:var(--primary);color:var(--on-primary);font-weight:650;font-size:14px;width:100%;margin-top:8px}
.assist{height:48px;border-radius:12px;border:1px solid var(--border);background:var(--surface-elevated);color:var(--ink-secondary);font-size:13px;font-weight:550;width:100%;margin-top:8px}
.navbar{height:64px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--border);padding-bottom:8px}
a.nav-item{text-decoration:none;color:inherit}
.nav-item{border:0;background:transparent;color:var(--ink-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;min-height:48px}
.nav-item svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:var(--primary-pressed)}
.home{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:120px;height:4px;border-radius:4px;background:var(--ink);opacity:.2;z-index:5}
.badge-id{display:inline-block;font-size:9px;color:var(--ink-muted);border:1px dashed #cfc9bd;padding:1px 5px;border-radius:3px;font-family:var(--mono);vertical-align:middle;margin-left:4px}
.backdrop-blur{filter:blur(2px);pointer-events:none;user-select:none}

.scrim{position:absolute;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;cursor:pointer}
.sheet{
  width:100%;height:92%;max-height:92%;
  background:var(--surface);border-radius:28px 28px 0 0;
  border:1px solid var(--border);border-bottom:0;
  box-shadow:0 -12px 40px rgba(40,30,20,.18);
  display:flex;flex-direction:column;cursor:default;overflow:hidden;
}
.handle{width:40px;height:4px;border-radius:4px;background:color-mix(in oklch,var(--ink) 18%,transparent);margin:10px auto 4px;flex-shrink:0}
.sheet-head{padding:4px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-shrink:0}
.sheet-head h2{font-size:18px;font-weight:650;letter-spacing:0;line-height:1.35}
.sheet-sub{font-size:12px;color:var(--ink-muted);margin-top:4px;line-height:1.45}
.close-btn{width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:var(--ink-secondary);display:grid;place-items:center;flex-shrink:0;cursor:pointer}
.close-btn:hover{background:color-mix(in oklch,var(--ink) 6%,transparent);color:var(--ink)}
.close-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.close-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}

.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:0 16px 8px;display:flex;flex-direction:column;gap:8px}
.outer-seg{display:flex;gap:4px;padding:0;border:0;border-bottom:1px solid var(--border);border-radius:0;background:transparent;flex-shrink:0}
.outer-seg button{flex:1;min-height:44px;border:0;border-radius:0;background:transparent;color:var(--ink-muted);font-size:14px;font-weight:550;cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-1px}
.outer-seg button:hover{color:var(--ink);background:transparent}
.outer-seg button.active{background:transparent;color:var(--primary-pressed);font-weight:650;box-shadow:none;border-bottom-color:var(--primary)}
.pane{display:none;flex-direction:column;gap:8px;min-height:0}
.pane.show{display:flex;flex:1 1 auto;min-height:220px}
.tpl-list{display:flex;flex-direction:column;gap:8px;flex:1 1 auto;min-height:200px;max-height:none;overflow:auto}
.pane[data-pane="builder"]{overflow:auto;min-height:220px}
/* template viewport guarantee */
.pane[data-pane="template"].show,.pane.show[data-pane="template"]{min-height:240px}
.tpl-card{text-align:left;border:1px solid var(--border);border-radius:14px;padding:12px 14px;background:var(--surface-elevated);cursor:pointer;font-family:inherit}
.tpl-card.active{border-color:color-mix(in oklch,var(--primary) 50%,var(--border));background:color-mix(in oklch,var(--primary) 12%,var(--surface))}
.tpl-card .t{font-size:14px;font-weight:650;color:var(--ink);margin-bottom:2px}
.tpl-card .d{font-size:12px;color:var(--ink-muted);line-height:1.4}
.dim-block{display:flex;flex-direction:column;gap:8px}
.dim-label{font-size:11px;color:var(--ink-muted);font-weight:650;letter-spacing:.06em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface-elevated);color:var(--ink-secondary);font-size:13px;cursor:pointer;font-family:inherit}
.chip:hover{color:var(--ink);border-color:color-mix(in oklch,var(--ink) 20%,var(--border))}
.chip.active{border-color:color-mix(in oklch,var(--primary) 50%,var(--border));color:var(--primary-pressed);background:color-mix(in oklch,var(--primary) 14%,transparent);font-weight:650}
.chip:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.preview-block{border:1px solid var(--border);border-radius:16px;background:var(--canvas);overflow:hidden;flex-shrink:0}
.preview-tabs{display:flex;gap:20px;padding:0 14px;border-bottom:1px solid var(--border);background:var(--surface)}
.preview-tabs button{min-height:36px;border:0;background:transparent;color:var(--ink-muted);font-size:14px;font-weight:550;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;padding:0 2px}
.preview-tabs button.active{color:var(--primary-pressed);border-bottom-color:var(--primary);font-weight:650}
.preview-text{min-height:48px;max-height:72px;overflow:auto;padding:8px 12px;font-size:13px;line-height:1.45;color:var(--ink);white-space:pre-wrap}
.preview-text .muted{color:var(--ink-muted)}
.preview-text .streaming{border-right:2px solid var(--primary);padding-right:2px;animation:blink 1s step-end infinite}
@keyframes blink{50%{border-color:transparent}}

.style-row,.refine-row{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.style-row .chips,.refine-row .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.section-cap{font-size:11px;color:var(--ink-muted);font-weight:650;letter-spacing:.06em;text-transform:uppercase}

.progress-row{display:none;align-items:center;gap:10px;font-size:12px;color:var(--ink-secondary);flex-shrink:0}
.progress-row.show{display:flex}
.progress-track{flex:1;height:4px;border-radius:99px;background:var(--surface-elevated);overflow:hidden}
.progress-track>i{display:block;height:100%;width:42%;background:var(--primary);border-radius:99px;animation:indeterminate 1.2s ease-in-out infinite}
@keyframes indeterminate{0%{transform:translateX(-120%)}100%{transform:translateX(280%)}}

.sheet-foot{padding:8px 16px 14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:0;flex-shrink:0;background:var(--surface)}
.tool-row{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.tool-row .spacer{flex:1;min-width:4px}
.tool-row.primary-pair{display:none}
.clear-row{display:none}
.text-btn,.outline-btn,.filled-btn{min-height:44px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:650;cursor:pointer;font-family:inherit;white-space:nowrap}
.text-btn{border:0;background:transparent;color:var(--primary-pressed)}
.text-btn:hover{background:color-mix(in oklch,var(--primary) 10%,transparent)}
.outline-btn{border:1px solid var(--border);background:transparent;color:var(--ink-secondary)}
.outline-btn:hover{color:var(--ink);border-color:color-mix(in oklch,var(--primary) 40%,var(--border))}
.filled-btn{border:0;background:var(--primary);color:var(--on-primary)}
.filled-btn:hover{background:var(--primary-pressed)}
.filled-btn.danger{background:var(--danger)}
.text-btn:focus-visible,.outline-btn:focus-visible,.filled-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.filled-btn[hidden],.outline-btn[hidden]{display:none!important}

.state-bar{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 6px;flex-shrink:0}
.state-bar button{min-height:32px;padding:0 10px;border-radius:999px;border:1px dashed var(--border);background:transparent;color:var(--ink-muted);font-size:10px;font-family:var(--mono);cursor:pointer}
.state-bar button.on{border-style:solid;color:var(--primary-pressed);border-color:color-mix(in oklch,var(--primary) 45%,var(--border));background:color-mix(in oklch,var(--primary) 10%,transparent)}
.hidden{display:none!important}

a.back,a.theme-switch,a.jump{position:fixed;bottom:14px;z-index:50;font-size:12px;color:var(--ink-secondary);text-decoration:none;background:var(--surface);border:1px solid var(--border);padding:6px 10px;border-radius:8px}
a.back{left:18px} a.theme-switch{left:110px} a.jump{left:210px}
.corner-tag{position:fixed;right:18px;bottom:14px;z-index:50;font-size:10px;font-family:var(--mono);color:var(--ink-muted);background:var(--surface);border:1px dashed var(--border);padding:4px 8px;border-radius:6px}

*{scrollbar-width:thin;scrollbar-color:color-mix(in oklch,var(--ink-muted,#71717a) 55%,transparent) transparent}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-button{display:none;width:0;height:0}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:color-mix(in oklch,var(--ink-muted,#71717a) 45%,transparent);border-radius:999px;border:1px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:color-mix(in oklch,var(--ink-muted,#71717a) 70%,transparent);background-clip:padding-box}
*::-webkit-scrollbar-corner{background:transparent}
</style>
</head>

<script>
(function () {
  var root = document.querySelector('.sheet');
  var draft = '暖奶油纸面工作区，克制陶土强调，桌面工具气质';
  var enhanced = '暖奶油纸面工作区，克制陶土强调色点缀主操作，桌面工具气质，无商标、无霓虹，适合产品说明与界面氛围配图。';
  var streaming = '暖奶油纸面工作区，克制陶土强调色点缀主操作';
  var preview = document.getElementById('pa-preview');
  var refine = document.getElementById('pa-refine');
  var progress = document.getElementById('pa-progress');
  var enhanceBtn = document.getElementById('pa-enhance');
  var cancelBtn = document.getElementById('pa-cancel');
  var applyBtn = document.getElementById('pa-apply');
  var activeTab = 'enhanced';
  var state = 'done';

  function paint() {
    if (activeTab === 'draft') {
      preview.innerHTML = state === 'empty' ? '<span class="muted">在此编辑草稿，或从模板 / 结构化拼出…</span>' : draft;
    } else if (state === 'running') {
      preview.innerHTML = '<span class="streaming">' + streaming + '</span>';
    } else if (state === 'empty') {
      preview.innerHTML = '<span class="muted">尚无润色结果 · 点「AI 润色」生成</span>';
    } else {
      preview.textContent = enhanced;
    }
    refine.classList.toggle('hidden', !(activeTab === 'enhanced' && state === 'done'));
    progress.classList.toggle('show', state === 'running');
    enhanceBtn.hidden = state === 'running';
    cancelBtn.hidden = state !== 'running';
    applyBtn.disabled = !(activeTab === 'enhanced' && state === 'done');
    applyBtn.style.opacity = applyBtn.disabled ? '.45' : '1';
  }

  root.querySelectorAll('[data-seg]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      root.querySelectorAll('[data-seg]').forEach(function (b) { b.classList.toggle('active', b === btn); });
      root.querySelectorAll('[data-pane]').forEach(function (p) { p.classList.toggle('show', p.getAttribute('data-pane') === btn.getAttribute('data-seg')); });
    });
  });
  root.querySelectorAll('[data-tab]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      activeTab = btn.getAttribute('data-tab');
      root.querySelectorAll('[data-tab]').forEach(function (b) { b.classList.toggle('active', b === btn); });
      paint();
    });
  });
  root.querySelectorAll('.tpl-card').forEach(function (card) {
    card.addEventListener('click', function () {
      root.querySelectorAll('.tpl-card').forEach(function (c) { c.classList.toggle('active', c === card); });
    });
  });
  root.querySelectorAll('.chips').forEach(function (group) {
    group.querySelectorAll('.chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        if (group.closest('[data-od-id="prompt-assist-refine-chips"]')) return;
        if (group.parentElement && group.parentElement.classList.contains('dim-block')) {
          group.querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('active', c === chip); });
        } else if (group.closest('[data-od-id="prompt-assist-style-chips"]')) {
          group.querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('active', c === chip); });
        }
      });
    });
  });
  document.querySelectorAll('.state-bar [data-state]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state = btn.getAttribute('data-state');
      document.querySelectorAll('.state-bar [data-state]').forEach(function (b) { b.classList.toggle('on', b === btn); });
      if (state !== 'empty') {
        activeTab = 'enhanced';
        root.querySelectorAll('[data-tab]').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === 'enhanced'); });
      }
      paint();
    });
  });
  document.getElementById('pa-clear').addEventListener('click', function () {
    state = 'empty'; activeTab = 'draft';
    root.querySelectorAll('[data-tab]').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === 'draft'); });
    document.querySelectorAll('.state-bar [data-state]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-state') === 'empty'); });
    paint();
  });
  paint();
})();
</script>
</body>
</html>
