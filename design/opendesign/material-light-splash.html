<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Studio · Material 亮色 · 开屏</title>
  <style>
    :root {
      --canvas: #faf9f5;
      --surface: #ffffff;
      --surface-muted: #efeeeb;
      --ink: #141413;
      --ink-secondary: #3d3d3a;
      --ink-muted: #6c6a64;
      --border: #e7e6e1;
      --primary: #d97757;
      --primary-pressed: #a9583e;
      --font: Roboto, "Noto Sans SC", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: #d8d4cb;
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    .phone {
      width: min(390px, 100%);
      height: min(844px, 92vh);
      background: var(--canvas);
      border-radius: 36px;
      border: 1px solid #c9c3b8;
      box-shadow: 0 28px 64px rgba(40, 30, 20, 0.22);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .status {
      height: 44px;
      padding: 12px 22px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      background: transparent;
      z-index: 2;
    }
    .status .icons { display: flex; gap: 6px; opacity: .7; font-size: 11px; }
    .splash {
      flex: 1;
      display: grid;
      place-items: center;
      position: relative;
      margin-top: -44px;
    }
    .splash::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, color-mix(in oklch, var(--primary) 12%, transparent), transparent 68%);
      pointer-events: none;
    }
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 1;
      text-align: center;
      padding: 0 24px;
    }
    .logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      background: var(--surface) center/72% no-repeat url("assets/logo.png");
      border: 1px solid var(--border);
      box-shadow: 0 10px 28px rgba(40, 30, 20, 0.10);
    }
    .a12 {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translateX(-50%);
      width: 108px;
      height: 108px;
      border-radius: 28px;
      border: 1px dashed color-mix(in oklch, var(--primary) 35%, var(--border));
      opacity: 0.45;
      pointer-events: none;
    }
    .a12-label {
      position: absolute;
      top: calc(18% + 116px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: var(--ink-muted);
      opacity: 0.7;
      white-space: nowrap;
    }
    .name {
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-top: 8px;
    }
    .tag {
      font-size: 13px;
      color: var(--ink-muted);
    }
    .home {
      height: 24px;
      display: grid;
      place-items: center;
      padding-bottom: 8px;
    }
    .home-bar {
      width: 108px;
      height: 4px;
      border-radius: 999px;
      background: color-mix(in oklch, var(--ink) 28%, transparent);
    }
    .hint {
      position: absolute;
      left: 18px;
      bottom: 40px;
      font-size: 10px;
      color: var(--ink-muted);
      max-width: 160px;
      line-height: 1.4;
    }
    .theme-switch {
      position: absolute;
      right: 14px;
      bottom: 36px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
    }
    .theme-switch a {
      font-size: 11px;
      color: var(--ink-muted);
      text-decoration: none;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .theme-switch a:hover { color: var(--primary-pressed); border-color: color-mix(in oklch, var(--primary) 35%, var(--border)); }
    * { scrollbar-width: thin; scrollbar-color: color-mix(in oklch, var(--ink-muted) 55%, transparent) transparent; }
    *::-webkit-scrollbar { width: 6px; height: 6px; }
    *::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb {
      background: color-mix(in oklch, var(--ink-muted) 45%, transparent);
      border-radius: 999px;
      border: 1px solid transparent;
      background-clip: padding-box;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status">
      <span>9:41</span>
      <span class="icons">▮▮▮ · Wi‑Fi · 100%</span>
    </div>
    <div class="splash">
      <div class="a12" aria-hidden="true"></div>
      <div class="a12-label">Android 12 图标安全区示意</div>
      <div class="brand">
        <div class="logo" role="img" aria-label="AI Studio logo"></div>
        <div class="name">AI Studio</div>
        <div class="tag">对话 · 生图 · 生视频</div>
      </div>
      <div class="hint">静态构图参考 · 对齐原生 splash #faf9f5</div>
      <div class="theme-switch">
        <a href="material-dark-splash.html">深色</a>
        <a href="material-light-chat.html">进入对话</a>
      </div>
    </div>
    <div class="home"><div class="home-bar"></div></div>
  </div>
</body>
</html>
