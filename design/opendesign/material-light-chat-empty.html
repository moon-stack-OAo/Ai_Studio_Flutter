<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Studio · Material 亮色 · 对话空态</title>
  <style>
    :root {
      --canvas: #faf9f5;
      --surface: #ffffff;
      --surface-muted: #efeeeb;
      --ink: #141413;
      --ink-secondary: #3d3d3a;
      --ink-muted: #6c6a64;
      --border: #e7e6e1;
      --primary: #d97757;
      --primary-pressed: #a9583e;
      --on-primary: #ffffff;
      --success: #3f6f4e;
      --danger: #b42318;
      --font: Roboto, "Noto Sans SC", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, "Roboto Mono", "Noto Sans Mono", "SF Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: #d8d4cb;
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    .phone {
      width: min(390px, 100%);
      height: min(844px, 92vh);
      background: var(--canvas);
      border-radius: 36px;
      border: 1px solid #c9c3b8;
      box-shadow: 0 28px 64px rgba(40, 30, 20, 0.22);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .status {
      height: 44px;
      padding: 12px 22px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      background: var(--surface);
    }
    .status .icons { display: flex; gap: 6px; opacity: .7; font-size: 11px; }
    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 8px 0 4px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .icon-btn {
      width: 48px; height: 48px; border: 0; border-radius: 24px;
      background: transparent; color: var(--ink-secondary);
      display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
      text-decoration: none;
    }
    .icon-btn:hover, .icon-btn:active { background: var(--surface-muted); color: var(--ink); }
    .icon-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
    .icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .top-title { flex: 1; min-width: 0; }
    .top-title h1 { font-size: 16px; font-weight: 650; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-title .sub { font-size: 11px; color: var(--ink-muted); margin-top: 1px; letter-spacing: 0; }
    .badge-id {
      display: inline-block; font-size: 9px; color: var(--ink-muted);
      border: 1px dashed color-mix(in oklch, var(--border) 60%, #aaa);
      padding: 1px 5px; border-radius: 3px; font-family: var(--mono); vertical-align: middle;
    }
    .state-bar {
      display: flex; gap: 8px; padding: 10px 12px;
      border-bottom: 1px solid var(--border); background: var(--surface);
      overflow-x: auto;
    }
    .state-pill {
      min-height: 48px; padding: 0 14px; border-radius: 999px;
      border: 1px solid var(--border); background: transparent;
      font-size: 12px; color: var(--ink-secondary); cursor: pointer;
      font-family: inherit; white-space: nowrap; letter-spacing: 0;
    }
    .state-pill:hover { color: var(--ink); background: color-mix(in oklch, var(--primary) 10%, var(--surface)); }
    .state-pill.active {
      background: color-mix(in oklch, var(--primary) 14%, white);
      color: var(--primary-pressed);
      border-color: color-mix(in oklch, var(--primary) 35%, var(--border));
      font-weight: 650;
    }
    .state-pill:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
    .messages {
      flex: 1; overflow: auto; padding: 20px 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .empty-card {
      width: 100%; max-width: 320px; text-align: center;
      padding: 28px 20px; border-radius: 20px;
      background: var(--surface); border: 1px solid var(--border);
      display: none; flex-direction: column; align-items: center; gap: 0;
    }
    body[data-state="unconfigured"] .view-unconfigured,
    body[data-state="no-messages"] .view-no-messages { display: flex; }
    .illu { width: 88px; height: 88px; margin: 0 auto 18px; color: var(--primary); }
    .empty-card h2 {
      font-size: 18px; font-weight: 650; letter-spacing: 0;
      margin-bottom: 8px; line-height: 1.35; color: var(--ink);
    }
    .empty-card p {
      font-size: 13px; color: var(--ink-muted); line-height: 1.6;
      margin-bottom: 20px; letter-spacing: 0;
    }
    .cta-stack { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; padding: 0 18px; border-radius: 14px; border: 0;
      background: var(--primary); color: var(--on-primary);
      font-size: 14px; font-weight: 650; text-decoration: none;
      cursor: pointer; font-family: inherit; letter-spacing: 0; width: 100%;
    }
    .btn-primary:hover { background: var(--primary-pressed); }
    .btn-primary:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .btn-ghost {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; padding: 0 18px; border-radius: 14px;
      border: 1px solid var(--border); background: transparent;
      color: var(--ink-secondary); font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit; letter-spacing: 0; width: 100%;
    }
    .btn-ghost:hover { color: var(--ink); background: color-mix(in oklch, var(--primary) 8%, var(--surface)); border-color: color-mix(in oklch, var(--primary) 30%, var(--border)); }
    .btn-ghost:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .label-caps {
      font-size: 10px; font-weight: 650; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--ink-muted); margin-bottom: 12px;
    }
    .composer-area {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 8px 12px 10px;
    }
    .composer {
      display: flex; align-items: flex-end; gap: 8px;
    }
    .composer.is-disabled { opacity: .48; }
    .attach-btn {
      width: 48px; height: 48px; border: 0; border-radius: 24px;
      background: var(--surface-muted); color: var(--ink-muted);
      display: grid; place-items: center; flex-shrink: 0; cursor: not-allowed;
    }
    .attach-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .composer textarea {
      flex: 1; min-height: 48px; max-height: 100px; resize: none;
      border: 1px solid var(--border); border-radius: 24px;
      background: var(--canvas); padding: 12px 16px;
      font: inherit; font-size: 14px; color: var(--ink); outline: 0;
      letter-spacing: 0;
    }
    .composer.is-disabled textarea { color: var(--ink-muted); }
    .send {
      width: 48px; height: 48px; border: 0; border-radius: 24px;
      background: var(--primary);
      color: #fff; cursor: pointer;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .composer.is-disabled .send {
      background: color-mix(in oklch, var(--primary) 35%, var(--border));
      cursor: not-allowed;
    }
    .send svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
    .hint { margin-top: 8px; font-size: 11px; color: var(--ink-muted); letter-spacing: 0; }
    .navbar {
      height: 64px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding-bottom: 8px;
    }
    a.nav-item { text-decoration: none; color: inherit; }
    .nav-item {
      border: 0; background: transparent; color: var(--ink-muted);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; font-size: 11px; cursor: pointer; min-height: 48px; letter-spacing: 0;
    }
    .nav-item svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.active { color: var(--primary-pressed); }
    .nav-item:focus-visible { outline: 2px solid var(--primary); outline-offset: -4px; }
    .home-indicator {
      position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
      width: 120px; height: 4px; border-radius: 4px; background: #2a2622; opacity: .35;
    }
    a.back {
      position: fixed; left: 18px; bottom: 14px; z-index: 20;
      font-size: 12px; color: var(--ink-secondary); text-decoration: none;
      background: var(--surface); border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px;
    }
    a.back:hover { color: var(--ink); }
    .corner-tag {
      position: fixed; right: 18px; bottom: 14px; z-index: 20;
      font-size: 10px; font-family: var(--mono); color: var(--ink-muted);
      background: var(--surface); border: 1px dashed var(--border); padding: 4px 8px; border-radius: 6px;
    }
    * { scrollbar-width: thin; scrollbar-color: color-mix(in oklch, var(--ink-muted) 55%, transparent) transparent; }
    *::-webkit-scrollbar { width: 6px; height: 6px; }
    *::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb {
      background: color-mix(in oklch, var(--ink-muted) 45%, transparent);
      border-radius: 999px; border: 1px solid transparent; background-clip: padding-box;
    }
    *::-webkit-scrollbar-thumb:hover {
      background: color-mix(in oklch, var(--ink-muted) 70%, transparent); background-clip: padding-box;
    }
    *::-webkit-scrollbar-corner { background: transparent; }
  </style>
</head>
<body data-state="unconfigured">
  <div class="phone" data-od-id="material-light-chat-empty">
    <div class="status" data-od-id="m-safe-area-top">
      <span>9:41</span>
      <span class="icons">▌▌▌ · 100%</span>
    </div>
    <header class="topbar" data-od-id="m-top-app-bar">
      <a class="icon-btn" href="material-light-sessions.html" title="会话列表" aria-label="打开会话列表" data-od-id="m-session-history-btn"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></a>
      <div class="top-title">
        <h1>对话</h1>
        <div class="sub">M-ChatEmpty · <span class="badge-id">CHAT-EMPTY</span></div>
      </div>
    </header>
    <div class="state-bar" data-od-id="m-empty-state-bar" role="tablist" aria-label="空态场景">
      <button type="button" class="state-pill active" data-set="unconfigured" role="tab" aria-selected="true">未配置提供商</button>
      <button type="button" class="state-pill" data-set="no-messages" role="tab" aria-selected="false">已配置 · 无消息</button>
    </div>
    <div class="messages" data-od-id="m-chat-empty">
      <div class="empty-card view-unconfigured" data-od-id="m-empty-unconfigured">
        <div class="label-caps">Empty · Provider</div>
        <svg class="illu" viewBox="0 0 88 88" fill="none" aria-hidden="true">
          <rect x="18" y="22" width="52" height="44" rx="12" stroke="currentColor" stroke-width="2"/>
          <path d="M30 38h28M30 48h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="64" cy="28" r="10" fill="var(--canvas)" stroke="currentColor" stroke-width="2"/>
          <path d="M64 24v8M60 28h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h2>尚未配置提供商</h2>
        <p>前往设置添加 API Key 后，即可开始流式对话。</p>
        <div class="cta-stack">
          <a class="btn-primary" href="material-light-settings.html" data-od-id="m-cta-settings">去设置</a>
        </div>
      </div>
      <div class="empty-card view-no-messages" data-od-id="m-empty-no-messages">
        <div class="label-caps">Empty · Messages</div>
        <svg class="illu" viewBox="0 0 88 88" fill="none" aria-hidden="true">
          <rect x="16" y="20" width="40" height="48" rx="10" stroke="currentColor" stroke-width="2"/>
          <path d="M24 32h24M24 40h18M24 48h22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <rect x="44" y="28" width="28" height="36" rx="10" fill="var(--canvas)" stroke="currentColor" stroke-width="2"/>
          <path d="M52 44h12M58 38v12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h2>开始第一条对话</h2>
        <p>当前会话还没有消息，在下方输入即可开始。</p>
        <div class="cta-stack">
          <a class="btn-ghost" href="material-light-sessions.html" data-od-id="m-cta-sessions">打开会话列表</a>
        </div>
      </div>
    </div>
    <div class="composer-area" data-od-id="m-composer-wrap">
      <div class="composer is-disabled" data-od-id="m-composer" aria-disabled="true">
        <button class="attach-btn" type="button" disabled aria-label="附加图片">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.4 11.6l-8.5 8.5a5.5 5.5 0 01-7.8-7.8l8.5-8.5a3.5 3.5 0 015 5l-8.2 8.2a1.5 1.5 0 01-2.1-2.1l7.1-7.1"/></svg>
        </button>
        <textarea rows="1" placeholder="配置完成后可在此输入…" disabled aria-label="消息输入"></textarea>
        <button class="send" type="button" disabled aria-label="发送">
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div class="hint" data-od-id="m-composer-hint">M-Composer · 未配置禁用 · CHAT-EMPTY</div>
    </div>
    <nav class="navbar" data-od-id="m-nav-bar" aria-label="主导航">
      <a class="nav-item active" href="material-light-chat.html" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 6h16v10H8l-4 3V6z"/></svg>对话</a>
      <a class="nav-item" href="material-light-image.html"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4 16l5-4 4 3 3-2 4 3"/></svg>生图</a>
      <a class="nav-item" href="material-light-video.html"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>生视频</a>
      <a class="nav-item" href="material-light-settings.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2"/></svg>设置</a>
    </nav>
    <div class="home-indicator" aria-hidden="true"></div>
  </div>
  <a class="back" href="index.html">← 总览</a>
  <a class="back" style="left:110px" href="material-dark-chat-empty.html">暗色空态</a>
  <a class="back" style="left:200px" href="material-light-chat.html">有内容稿</a>
  <div class="corner-tag">M-ChatEmpty · CHAT-EMPTY · Light</div>
  <script>
    (function () {
      var pills = document.querySelectorAll('.state-pill');
      var composer = document.querySelector('[data-od-id="m-composer"]');
      var textarea = composer && composer.querySelector('textarea');
      var send = composer && composer.querySelector('.send');
      var attach = composer && composer.querySelector('.attach-btn');
      var hint = document.querySelector('[data-od-id="m-composer-hint"]');
      function syncComposer(state) {
        var ready = state === 'no-messages';
        if (!composer) return;
        composer.classList.toggle('is-disabled', !ready);
        composer.setAttribute('aria-disabled', ready ? 'false' : 'true');
        if (textarea) {
          textarea.disabled = !ready;
          textarea.placeholder = ready ? '输入消息…' : '配置完成后可在此输入…';
        }
        if (send) send.disabled = !ready;
        if (attach) attach.disabled = !ready;
        if (hint) {
          hint.textContent = ready
            ? 'M-Composer · 可输入 · CHAT-EMPTY'
            : 'M-Composer · 未配置禁用 · CHAT-EMPTY';
        }
      }
      pills.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var s = btn.getAttribute('data-set');
          document.body.setAttribute('data-state', s);
          pills.forEach(function (p) {
            var on = p === btn;
            p.classList.toggle('active', on);
            p.setAttribute('aria-selected', on ? 'true' : 'false');
          });
          syncComposer(s);
        });
      });
      syncComposer(document.body.getAttribute('data-state'));
    })();
  </script>
</body>
</html>
