<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Studio · Fluent 亮色 · 生图空态</title>
  <style>
    :root {
      --canvas: #faf9f5; --surface: #ffffff; --surface-elevated: #efeeeb;
      --ink: #141413; --ink-secondary: #3d3d3a; --ink-muted: #6c6a64;
      --border: #e7e6e1; --primary: #d97757; --primary-pressed: #a9583e;
      --on-primary: #ffffff; --success: #3f6f4e; --danger: #b42318;
      --nav-w: 56px; --params-w: 300px;
      --font: system-ui, "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, "Cascadia Code", "Cascadia Mono", "SF Mono", Consolas, "Microsoft YaHei Mono", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: #d8d4cb; color: var(--ink); min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .window { width: min(1280px,100%); height: min(820px,92vh); background: var(--canvas); border: 1px solid color-mix(in oklch,var(--border) 70%,#b8b2a6); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 24px 64px rgba(40,30,20,.18); }
    .titlebar { height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 14px; background: color-mix(in oklch,var(--surface) 70%,var(--surface-elevated)); border-bottom: 1px solid var(--border); user-select: none; }
    .titlebar-left { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-secondary); }
    .app-mark { width: 16px; height: 16px; border-radius: 4px; background: center/contain no-repeat url("assets/logo.png"); flex-shrink: 0; }
    .win-controls { display: flex; gap: 8px; }
    .win-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid color-mix(in oklch,var(--border) 80%,#999); background: #eceae4; }
    .shell { flex: 1; display: flex; min-height: 0; }
    .nav { width: var(--nav-w); background: var(--surface-elevated); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 4px; }
    a.nav-btn { text-decoration: none; color: inherit; }
    .nav-btn { width: 40px; height: 40px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-secondary); display: grid; place-items: center; cursor: pointer; position: relative; }
    .nav-btn:hover { background: color-mix(in oklch,var(--ink) 5%,transparent); color: var(--ink); }
    .nav-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .nav-btn.active { background: color-mix(in oklch,var(--primary) 14%,white); color: var(--primary-pressed); }
    .nav-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .cap { position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%); font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #2a2622; color: #f5f0e8; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 5; }
    .nav-btn:hover .cap { opacity: 1; }
    .nav-spacer { flex: 1; }
    .badge-id { display: inline-block; font-size: 9px; letter-spacing: .02em; color: var(--ink-muted); border: 1px dashed color-mix(in oklch,var(--border) 60%,#aaa); padding: 1px 5px; border-radius: 3px; margin-left: 6px; vertical-align: middle; font-family: var(--mono); }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--canvas); order: 1; }
    .params { width: var(--params-w); background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; order: 2; }
    .params.is-disabled { opacity: .48; pointer-events: none; user-select: none; }
    .params-scroll { flex: 1; overflow: auto; padding: 14px 14px 8px; }
    .params h2 { font-size: 13px; font-weight: 650; color: var(--ink-secondary); margin-bottom: 12px; letter-spacing: 0; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 11px; color: var(--ink-muted); margin-bottom: 6px; font-weight: 550; letter-spacing: 0; }
    .label-en { letter-spacing: .06em; text-transform: uppercase; font-family: var(--mono); font-size: 10px; color: var(--ink-muted); margin-bottom: 6px; }
    .input, .select, .textarea {
      width: 100%; border-radius: 7px; border: 1px solid var(--border);
      background: var(--surface-elevated); padding: 0 10px; font: inherit; font-size: 13px; color: var(--ink-muted);
    }
    .input, .select { height: 34px; }
    .textarea { padding: 10px; min-height: 88px; resize: none; line-height: 1.45; }
    .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 3px; border-radius: 8px; background: var(--canvas); border: 1px solid var(--border); }
    .seg.seg-4 { grid-template-columns: repeat(4, 1fr); }
    .seg button { height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--ink-muted); font-size: 11px; cursor: default; font-family: inherit; }
    .seg button.active { background: color-mix(in oklch,var(--primary) 14%,transparent); color: var(--primary-pressed); font-weight: 600; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-elevated); color: var(--ink-muted); font-size: 11px; cursor: default; font-family: inherit; }
    .chip.active { border-color: color-mix(in oklch,var(--primary) 40%,var(--border)); color: var(--primary-pressed); background: color-mix(in oklch,var(--primary) 12%,transparent); }
    .ref-box { border: 1px dashed var(--border); border-radius: 8px; padding: 12px; background: var(--canvas); text-align: center; color: var(--ink-muted); font-size: 12px; }
    .ref-box strong { display: block; color: var(--ink-secondary); margin-bottom: 4px; font-weight: 550; letter-spacing: 0; }
    .params-foot { padding: 12px 14px 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    .primary-btn { height: 36px; border: 0; border-radius: 8px; background: color-mix(in oklch,var(--primary) 40%,var(--border)); color: #fff; font-size: 13px; font-weight: 650; cursor: not-allowed; font-family: inherit; }
    .assist { height: 30px; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: var(--ink-muted); font-size: 12px; cursor: not-allowed; font-family: inherit; }
    .commandbar { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--border); background: color-mix(in oklch,var(--surface) 85%,var(--canvas)); }
    .commandbar h1 { font-size: 14px; font-weight: 600; margin-right: 8px; letter-spacing: 0; }
    .state-bar { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .state-pill { height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: transparent; font-size: 12px; color: var(--ink-secondary); cursor: pointer; font-family: inherit; letter-spacing: 0; }
    .state-pill:hover { color: var(--ink); background: var(--surface-elevated); }
    .state-pill.active { background: color-mix(in oklch,var(--primary) 14%,white); color: var(--primary-pressed); border-color: color-mix(in oklch,var(--primary) 35%,var(--border)); font-weight: 600; }
    .state-pill:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
    .stage { flex: 1; overflow: auto; padding: 28px; display: flex; align-items: center; justify-content: center; }
    .empty-card { max-width: 420px; text-align: center; padding: 28px 24px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); }
    .illu { width: 88px; height: 88px; margin: 0 auto 18px; color: var(--primary); }
    .empty-card h2 { font-size: 18px; font-weight: 650; letter-spacing: 0; margin-bottom: 8px; line-height: 1.35; }
    .empty-card p { font-size: 13px; color: var(--ink-muted); line-height: 1.6; margin-bottom: 18px; letter-spacing: 0; }
    .btn-primary { display: inline-flex; align-items: center; justify-content: center; height: 36px; padding: 0 18px; border-radius: 8px; border: 0; background: var(--primary); color: var(--on-primary); font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; font-family: inherit; letter-spacing: 0; }
    .btn-primary:hover { background: var(--primary-pressed); }
    .btn-primary:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .view { display: none; }
    body[data-state="unconfigured"] .view-unconfigured,
    body[data-state="no-history"] .view-no-history { display: block; }
    body[data-state="no-history"] .params { opacity: .72; pointer-events: auto; }
    body[data-state="no-history"] .params .primary-btn { background: var(--primary); cursor: pointer; }
    body[data-state="no-history"] .params .assist { color: var(--ink-secondary); cursor: pointer; }
    body[data-state="no-history"] .params .assist:hover,
    body[data-state="no-history"] .params .primary-btn:hover { filter: brightness(.96); }
    a.back { position: fixed; left: 18px; bottom: 14px; z-index: 20; font-size: 12px; color: var(--ink-secondary); text-decoration: none; background: var(--surface); border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px; letter-spacing: 0; }
    a.back:hover { color: var(--ink); border-color: color-mix(in oklch,var(--primary) 35%,var(--border)); }
    .corner-tag { position: fixed; right: 18px; bottom: 14px; z-index: 20; font-size: 10px; font-family: var(--mono); color: var(--ink-muted); background: color-mix(in oklch,var(--surface) 90%,transparent); border: 1px dashed var(--border); padding: 4px 8px; border-radius: 6px; }
    * { scrollbar-width: thin; scrollbar-color: color-mix(in oklch,var(--ink-muted) 55%,transparent) transparent; }
    *::-webkit-scrollbar { width: 6px; height: 6px; }
    *::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: color-mix(in oklch,var(--ink-muted) 45%,transparent); border-radius: 999px; border: 1px solid transparent; background-clip: padding-box; }
    *::-webkit-scrollbar-thumb:hover { background: color-mix(in oklch,var(--ink-muted) 70%,transparent); background-clip: padding-box; }
    *::-webkit-scrollbar-corner { background: transparent; }
  </style>
</head>
<body data-state="unconfigured">
  <div class="window" data-od-id="fluent-light-image-empty">
    <div class="titlebar" data-od-id="f-titlebar">
      <div class="titlebar-left">
        <div class="app-mark" aria-hidden="true"></div>
        <span>AI Studio</span>
        <span class="badge-id">F-ImageEmpty · IMG-EMPTY</span>
      </div>
      <div class="win-controls" aria-hidden="true"><span class="win-dot"></span><span class="win-dot"></span><span class="win-dot"></span></div>
    </div>
    <div class="shell">
      <nav class="nav" data-od-id="f-navview" aria-label="主导航">
        <a class="nav-btn" href="fluent-light-chat.html" title="对话"><svg viewBox="0 0 24 24"><path d="M4 6h16v10H8l-4 3V6z"/></svg><span class="cap">对话</span></a>
        <a class="nav-btn active" href="fluent-light-image.html" title="生图"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4 16l5-4 4 3 3-2 4 3"/></svg><span class="cap">生图</span></a>
        <a class="nav-btn" href="fluent-light-video.html" title="生视频"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg><span class="cap">生视频</span></a>
        <div class="nav-spacer"></div>
        <a class="nav-btn" href="fluent-light-settings-providers.html" title="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="cap">设置</span></a>
      </nav>

      <section class="main" data-od-id="image-main-empty">
        <div class="commandbar">
          <h1>生图</h1>
          <span class="badge-id">IMG-EMPTY</span>
        </div>
        <div class="state-bar" data-od-id="f-empty-state-bar" role="tablist" aria-label="空态场景">
          <button type="button" class="state-pill active" data-set="unconfigured" role="tab" aria-selected="true">未配置生图模型</button>
          <button type="button" class="state-pill" data-set="no-history" role="tab" aria-selected="false">已配置 · 无历史</button>
        </div>
        <div class="stage" data-od-id="f-image-empty">
          <div class="empty-card view view-unconfigured" data-od-id="f-empty-unconfigured">
            <svg class="illu" viewBox="0 0 88 88" fill="none" aria-hidden="true">
              <rect x="16" y="20" width="56" height="48" rx="8" stroke="currentColor" stroke-width="2"/>
              <circle cx="32" cy="38" r="5" stroke="currentColor" stroke-width="2"/>
              <path d="M16 56l14-12 12 9 10-7 16 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="66" cy="26" r="10" fill="var(--canvas)" stroke="currentColor" stroke-width="2"/>
              <path d="M66 22v8M62 26h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <h2>尚未配置生图模型</h2>
            <p>前往设置添加 API Key 并选择生图模型后，即可开始文生图。</p>
            <a class="btn-primary" href="fluent-light-settings-providers.html" data-od-id="f-cta-settings">去设置</a>
          </div>
          <div class="empty-card view view-no-history" data-od-id="f-empty-no-history">
            <svg class="illu" viewBox="0 0 88 88" fill="none" aria-hidden="true">
              <rect x="14" y="18" width="36" height="52" rx="6" stroke="currentColor" stroke-width="2"/>
              <path d="M22 30h20M22 38h14M22 46h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <rect x="40" y="28" width="34" height="34" rx="6" fill="var(--canvas)" stroke="currentColor" stroke-width="2"/>
              <circle cx="52" cy="42" r="4" stroke="currentColor" stroke-width="2"/>
              <path d="M40 54l10-8 8 6 6-4 10 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <h2>时间线空</h2>
            <p>在右侧参数区填写提示词后生成。</p>
          </div>
        </div>
      </section>

      <aside class="params is-disabled" data-od-id="f-image-params-empty" aria-disabled="true">
        <div class="params-scroll">
          <h2>参数 <span class="badge-id">F-ImageParams · IMG-EMPTY</span></h2>
          <div class="field">
            <div class="label-en">Model</div>
            <label for="model">模型</label>
            <select class="select" id="model" disabled>
              <option>未配置</option>
            </select>
          </div>
          <div class="field">
            <label>数量</label>
            <div class="seg seg-4">
              <button type="button" disabled>1</button>
              <button type="button" class="active" disabled>2</button>
              <button type="button" disabled>3</button>
              <button type="button" disabled>4</button>
            </div>
          </div>
          <div class="field">
            <label>比例</label>
            <div class="chips">
              <button class="chip active" type="button" disabled>1:1</button>
              <button class="chip" type="button" disabled>16:9</button>
              <button class="chip" type="button" disabled>9:16</button>
            </div>
          </div>
          <div class="field">
            <label for="prompt">提示词</label>
            <textarea class="textarea" id="prompt" disabled placeholder="配置完成后可在此输入…"></textarea>
          </div>
          <div class="field">
            <label>参考图</label>
            <div class="ref-box"><strong>拖放或选择文件</strong>空态弱化示意</div>
          </div>
        </div>
        <div class="params-foot">
          <button class="assist" type="button" disabled>提示词辅助</button>
          <button class="primary-btn" type="button" disabled>生成</button>
        </div>
      </aside>
    </div>
  </div>
  <a class="back" href="index.html">← 总览</a>
  <a class="back" style="left:110px" href="fluent-dark-image-empty.html">暗色空态</a>
  <a class="back" style="left:200px" href="fluent-light-image.html">有内容稿</a>
  <div class="corner-tag">F-ImageEmpty · IMG-EMPTY · Light</div>
  <script>
    (function () {
      var pills = document.querySelectorAll('.state-pill');
      var params = document.querySelector('.params');
      pills.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var s = btn.getAttribute('data-set');
          document.body.setAttribute('data-state', s);
          pills.forEach(function (p) {
            var on = p === btn;
            p.classList.toggle('active', on);
            p.setAttribute('aria-selected', on ? 'true' : 'false');
          });
          if (params) {
            var off = s === 'unconfigured';
            params.classList.toggle('is-disabled', off);
            params.setAttribute('aria-disabled', off ? 'true' : 'false');
          }
        });
      });
    })();
  </script>
</body>
</html>
