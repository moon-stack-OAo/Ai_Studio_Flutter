<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Studio · Fluent 亮色 · 对话空态</title>
  <style>
    :root {
      --canvas: #faf9f5; --surface: #ffffff; --surface-muted: #efeeeb;
      --ink: #141413; --ink-secondary: #3d3d3a; --ink-muted: #6c6a64;
      --border: #e7e6e1; --primary: #d97757; --primary-pressed: #a9583e;
      --on-primary: #ffffff; --success: #3f6f4e; --danger: #b42318;
      --nav-w: 56px; --session-w: 260px;
      --font: system-ui, "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, "Cascadia Code", "Cascadia Mono", "SF Mono", Consolas, "Microsoft YaHei Mono", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: #d8d4cb; color: var(--ink); min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .window { width: min(1280px,100%); height: min(820px,92vh); background: var(--canvas); border: 1px solid color-mix(in oklch,var(--border) 70%,#b8b2a6); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 24px 64px rgba(40,30,20,.18); }
    .titlebar { height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 14px; background: color-mix(in oklch,var(--surface) 70%,var(--surface-muted)); border-bottom: 1px solid var(--border); user-select: none; }
    .titlebar-left { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-secondary); }
    .app-mark { width: 16px; height: 16px; border-radius: 4px; background: center/contain no-repeat url("assets/logo.png"); flex-shrink: 0; }
    .win-controls { display: flex; gap: 8px; }
    .win-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid color-mix(in oklch,var(--border) 80%,#999); background: #eceae4; }
    .shell { flex: 1; display: flex; min-height: 0; }
    .nav { width: var(--nav-w); background: var(--surface-muted); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 4px; }
    a.nav-btn { text-decoration: none; color: inherit; }
    .nav-btn { width: 40px; height: 40px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-secondary); display: grid; place-items: center; cursor: pointer; position: relative; }
    .nav-btn:hover { background: color-mix(in oklch,var(--ink) 5%,transparent); color: var(--ink); }
    .nav-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .nav-btn.active { background: color-mix(in oklch,var(--primary) 14%,white); color: var(--primary-pressed); }
    .nav-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .cap { position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%); font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #2a2622; color: #f5f0e8; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 5; }
    .nav-btn:hover .cap { opacity: 1; }
    .nav-spacer { flex: 1; }
    .session { width: var(--session-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; }
    .session-head { padding: 12px 12px 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .session-head h2 { font-size: 13px; font-weight: 600; color: var(--ink-secondary); }
    .icon-btn { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-secondary); cursor: pointer; display: grid; place-items: center; }
    .icon-btn:hover { background: var(--surface-muted); color: var(--ink); }
    .icon-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
    .icon-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .session-list { flex: 1; overflow: auto; padding: 8px; }
    .session-empty { padding: 20px 12px; text-align: center; }
    .session-empty .t { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .session-empty .d { font-size: 12px; color: var(--ink-muted); line-height: 1.5; margin-bottom: 12px; }
    .session-item {
      width: 100%; text-align: left; border: 0; background: transparent;
      padding: 10px 10px; border-radius: 8px; cursor: pointer; color: var(--ink);
    }
    .session-item.active { background: color-mix(in oklch,var(--primary) 10%,white); }
    .session-item .t { font-size: 13px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session-item .d { font-size: 11px; color: var(--ink-muted); margin-top: 3px; }
    .badge-id { display: inline-block; font-size: 9px; letter-spacing: .02em; color: var(--ink-muted); border: 1px dashed color-mix(in oklch,var(--border) 60%,#aaa); padding: 1px 5px; border-radius: 3px; margin-left: 6px; vertical-align: middle; font-family: var(--mono); }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--canvas); }
    .commandbar { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--border); background: color-mix(in oklch,var(--surface) 85%,var(--canvas)); }
    .commandbar h1 { font-size: 14px; font-weight: 600; margin-right: 8px; letter-spacing: 0; }
    .state-bar { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .state-pill { height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: transparent; font-size: 12px; color: var(--ink-secondary); cursor: pointer; font-family: inherit; }
    .state-pill:hover { color: var(--ink); background: var(--surface-muted); }
    .state-pill.active { background: color-mix(in oklch,var(--primary) 14%,white); color: var(--primary-pressed); border-color: color-mix(in oklch,var(--primary) 35%,var(--border)); font-weight: 600; }
    .state-pill:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
    .messages { flex: 1; overflow: auto; padding: 28px; display: flex; align-items: center; justify-content: center; }
    .empty-card { max-width: 420px; text-align: center; padding: 28px 24px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); }
    .illu { width: 88px; height: 88px; margin: 0 auto 18px; color: var(--primary); }
    .empty-card h2 { font-size: 18px; font-weight: 650; letter-spacing: 0; margin-bottom: 8px; line-height: 1.35; }
    .empty-card p { font-size: 13px; color: var(--ink-muted); line-height: 1.6; margin-bottom: 18px; }
    .btn-primary { display: inline-flex; align-items: center; justify-content: center; height: 36px; padding: 0 18px; border-radius: 8px; border: 0; background: var(--primary); color: var(--on-primary); font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; font-family: inherit; }
    .btn-primary:hover { background: var(--primary-pressed); }
    .btn-primary:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .composer-wrap { border-top: 1px solid var(--border); background: var(--surface); padding: 12px 20px 16px; }
    .composer { display: flex; gap: 10px; align-items: flex-end; border: 1px solid var(--border); border-radius: 12px; background: var(--canvas); padding: 10px 10px 10px 14px; }
    .composer.is-disabled { opacity: .55; }
    .composer textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; font: inherit; font-size: 14px; line-height: 1.5; min-height: 44px; color: var(--ink); }
    .composer.is-disabled textarea { color: var(--ink-muted); }
    .send { height: 36px; min-width: 72px; padding: 0 14px; border: 0; border-radius: 8px; background: var(--primary); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .composer.is-disabled .send { background: color-mix(in oklch,var(--primary) 35%,var(--border)); cursor: not-allowed; }
    .hint { margin-top: 8px; font-size: 11px; color: var(--ink-muted); }
    .view { display: none; }
    body[data-state="unconfigured"] .view-unconfigured,
    body[data-state="no-messages"] .view-no-messages { display: block; }
    body[data-state="unconfigured"] .session-list .for-nomessages,
    body[data-state="no-messages"] .session-list .for-unconfigured { display: none; }
    body[data-state="no-messages"] .session-list .view-no-messages { display: block; }
    a.back { position: fixed; left: 18px; bottom: 14px; z-index: 20; font-size: 12px; color: var(--ink-secondary); text-decoration: none; background: var(--surface); border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px; }
    a.back:hover { color: var(--ink); border-color: color-mix(in oklch,var(--primary) 35%,var(--border)); }
    .corner-tag { position: fixed; right: 18px; bottom: 14px; z-index: 20; font-size: 10px; font-family: var(--mono); color: var(--ink-muted); background: color-mix(in oklch,var(--surface) 90%,transparent); border: 1px dashed var(--border); padding: 4px 8px; border-radius: 6px; }
    * { scrollbar-width: thin; scrollbar-color: color-mix(in oklch,var(--ink-muted) 55%,transparent) transparent; }
    *::-webkit-scrollbar { width: 6px; height: 6px; }
    *::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: color-mix(in oklch,var(--ink-muted) 45%,transparent); border-radius: 999px; border: 1px solid transparent; background-clip: padding-box; }
    *::-webkit-scrollbar-thumb:hover { background: color-mix(in oklch,var(--ink-muted) 70%,transparent); background-clip: padding-box; }
    *::-webkit-scrollbar-corner { background: transparent; }
  </style>
</head>
<body data-state="unconfigured">
  <div class="window" data-od-id="fluent-light-chat-empty">
    <div class="titlebar" data-od-id="f-titlebar">
      <div class="titlebar-left">
        <div class="app-mark" aria-hidden="true"></div>
        <span>AI Studio</span>
        <span class="badge-id">F-ChatEmpty · CHAT-EMPTY</span>
      </div>
      <div class="win-controls" aria-hidden="true"><span class="win-dot"></span><span class="win-dot"></span><span class="win-dot"></span></div>
    </div>
    <div class="shell">
      <nav class="nav" data-od-id="f-navview" aria-label="主导航">
        <a class="nav-btn active" href="fluent-light-chat.html" title="对话"><svg viewBox="0 0 24 24"><path d="M4 6h16v10H8l-4 3V6z"/></svg><span class="cap">对话</span></a>
        <a class="nav-btn" href="fluent-light-image.html" title="生图"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4 16l5-4 4 3 3-2 4 3"/></svg><span class="cap">生图</span></a>
        <a class="nav-btn" href="fluent-light-video.html" title="生视频"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg><span class="cap">生视频</span></a>
        <div class="nav-spacer"></div>
        <a class="nav-btn" href="fluent-light-settings-providers.html" title="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="cap">设置</span></a>
      </nav>
      <aside class="session" data-od-id="f-session-list">
        <div class="session-head">
          <h2>会话 <span class="badge-id">F-SessionList</span></h2>
          <button class="icon-btn" type="button" title="新建会话" aria-label="新建会话" data-od-id="f-session-new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
        <div class="session-list">
          <div class="session-empty for-unconfigured" data-od-id="f-session-empty-unconfigured">
            <div class="t">暂无会话</div>
            <div class="d">配置提供商后即可开始。</div>
          </div>
          <div class="for-nomessages view view-no-messages" data-od-id="f-session-default">
            <button class="session-item active" type="button">
              <div class="t">新对话</div>
              <div class="d">今天 · 空闲</div>
            </button>
          </div>
        </div>
      </aside>
      <section class="main" data-od-id="chat-main-empty">
        <div class="commandbar">
          <h1>对话</h1>
          <span class="badge-id">CHAT-EMPTY</span>
        </div>
        <div class="state-bar" data-od-id="f-empty-state-bar" role="tablist" aria-label="空态场景">
          <button type="button" class="state-pill active" data-set="unconfigured" role="tab" aria-selected="true">未配置提供商</button>
          <button type="button" class="state-pill" data-set="no-messages" role="tab" aria-selected="false">已配置 · 无消息</button>
        </div>
        <div class="messages" data-od-id="f-chat-empty">
          <div class="empty-card view view-unconfigured" data-od-id="f-empty-unconfigured">
            <svg class="illu" viewBox="0 0 88 88" fill="none" aria-hidden="true">
              <rect x="18" y="22" width="52" height="44" rx="8" stroke="currentColor" stroke-width="2"/>
              <path d="M30 38h28M30 48h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <circle cx="64" cy="28" r="10" fill="var(--canvas)" stroke="currentColor" stroke-width="2"/>
              <path d="M64 24v8M60 28h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <h2>尚未配置提供商</h2>
            <p>前往设置添加 API Key 后，即可开始流式对话。</p>
            <a class="btn-primary" href="fluent-light-settings-providers.html" data-od-id="f-cta-settings">去设置</a>
          </div>
          <div class="empty-card view view-no-messages" data-od-id="f-empty-no-messages">
            <svg class="illu" viewBox="0 0 88 88" fill="none" aria-hidden="true">
              <rect x="16" y="20" width="40" height="48" rx="6" stroke="currentColor" stroke-width="2"/>
              <path d="M24 32h24M24 40h18M24 48h22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <rect x="44" y="28" width="28" height="36" rx="6" fill="var(--canvas)" stroke="currentColor" stroke-width="2"/>
              <path d="M52 44h12M58 38v12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <h2>开始第一条对话</h2>
            <p>当前会话还没有消息，在下方输入即可开始。</p>
          </div>
        </div>
        <div class="composer-wrap" data-od-id="f-composer-wrap">
          <div class="composer is-disabled" data-od-id="f-composer" aria-disabled="true">
            <textarea rows="2" placeholder="配置完成后可在此输入…" disabled aria-label="消息输入"></textarea>
            <button class="send" type="button" disabled>发送</button>
          </div>
          <div class="hint" data-od-id="f-composer-hint">F-Composer · 未配置禁用 · CHAT-EMPTY</div>
        </div>
      </section>
    </div>
  </div>
  <a class="back" href="index.html">← 总览</a>
  <a class="back" style="left:110px" href="fluent-dark-chat-empty.html">暗色空态</a>
  <a class="back" style="left:200px" href="fluent-light-chat.html">有内容稿</a>
  <div class="corner-tag">F-ChatEmpty · CHAT-EMPTY · Light</div>
  <script>
    (function () {
      var pills = document.querySelectorAll('.state-pill');
      var composer = document.querySelector('[data-od-id="f-composer"]');
      var textarea = composer && composer.querySelector('textarea');
      var send = composer && composer.querySelector('.send');
      var hint = document.querySelector('[data-od-id="f-composer-hint"]');
      function syncComposer(state) {
        var ready = state === 'no-messages';
        if (!composer) return;
        composer.classList.toggle('is-disabled', !ready);
        composer.setAttribute('aria-disabled', ready ? 'false' : 'true');
        if (textarea) {
          textarea.disabled = !ready;
          textarea.placeholder = ready ? '输入消息…' : '配置完成后可在此输入…';
        }
        if (send) send.disabled = !ready;
        if (hint) {
          hint.textContent = ready
            ? 'F-Composer · 可输入 · CHAT-EMPTY'
            : 'F-Composer · 未配置禁用 · CHAT-EMPTY';
        }
      }
      pills.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var s = btn.getAttribute('data-set');
          document.body.setAttribute('data-state', s);
          pills.forEach(function (p) {
            var on = p === btn;
            p.classList.toggle('active', on);
            p.setAttribute('aria-selected', on ? 'true' : 'false');
          });
          syncComposer(s);
        });
      });
      syncComposer(document.body.getAttribute('data-state'));
    })();
  </script>
</body>
</html>
