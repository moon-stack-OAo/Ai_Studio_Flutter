name: desktop_fluent
description: AI Studio desktop app (Fluent Design).
publish_to: 'none'
version: 1.0.5+1789109339

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  fluent_ui: ^4.16.1
  design_fluent:
    path: ../../packages/design_fluent
  core:
    path: ../../packages/core
  http: ^1.4.0
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.1
  window_manager: ^0.5.1
  tray_manager: ^0.5.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  video_player: ^2.14.0
  video_player_win: ^3.2.2
  desktop_drop: ^0.8.4
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # 保留：flutter_markdown 等依赖使用 Icons.*（Material Icons 字体），非本应用直接引用
  uses-material-design: true
  assets:
    - assets/tray_icon.ico
    - assets/tray_icon.png
    - assets/logo.png

flutter_native_splash:
  color: "#faf9f5"
  color_dark: "#0a0a0a"
  image: assets/logo.png
  image_dark: assets/logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#faf9f5"
    color_dark: "#0a0a0a"
    image: assets/logo.png
    image_dark: assets/logo.png
    icon_background_color: "#faf9f5"
    icon_background_color_dark: "#0a0a0a"
