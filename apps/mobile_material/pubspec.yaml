name: mobile_material
description: AI Studio mobile app (Material Design).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  design_material:
    path: ../../packages/design_material
  core:
    path: ../../packages/core
  package_info_plus: ^10.2.1
  http: ^1.4.0
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  url_launcher: ^6.3.2
  open_filex: ^4.7.0
  gal: ^2.3.3
  share_plus: ^13.1.0
  video_player: ^2.14.0
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_native_splash:
  color: "#faf9f5"
  color_dark: "#0a0a0a"
  image: assets/logo.png
  image_dark: assets/logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#faf9f5"
    color_dark: "#0a0a0a"
    image: assets/logo.png
    image_dark: assets/logo.png
    icon_background_color: "#faf9f5"
    icon_background_color_dark: "#0a0a0a"
