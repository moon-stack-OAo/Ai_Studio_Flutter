# 手动预览构建：Windows 安装包 + macOS zip（按芯片）+ Android APK + iOS 未签名 IPA（上传 artifact，不发 Release）
# iOS 产物需本机用 Sideloadly 等工具以 Apple ID 重签后才能装真机；正式分发走 release.yml（推送 v* tag）；日常校验走 ci.yml。
name: build

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.5"
          cache: true

      - name: Cache Inno Setup installer
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/innosetup-6.7.3.exe
          key: innosetup-6.7.3-exe

      - name: Pub get
        run: flutter pub get

      - name: Build Windows release
        working-directory: apps/desktop_fluent
        run: flutter build windows --release

      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION="$(grep -E '^version:' apps/desktop_fluent/pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*//; s/\+.*//')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # 简体中文语言包需 Inno Setup 6.5.0+；官方已迁 GitHub Releases，钉 6.7.3
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          if (-not (Test-Path -LiteralPath $installer)) {
            curl.exe -fsSL -o $installer https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          }
          if (-not (Test-Path -LiteralPath $installer) -or (Get-Item -LiteralPath $installer).Length -lt 1MB) {
            throw "Inno Setup installer missing or too small: $installer"
          }
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found' }
          echo "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Compile installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging/windows/output | Out-Null
          & "$env:ISCC" "/DMyAppVersion=${{ steps.ver.outputs.version }}" "packaging\windows\ai-studio.iss"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: packaging/windows/output/*.exe
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            suffix: aarch64
            label: Apple Silicon
          - runner: macos-15-intel
            suffix: x64
            label: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.5"
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build macOS release (${{ matrix.label }})
        working-directory: apps/desktop_fluent
        run: flutter build macos --release

      - name: Package zip
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^version:' apps/desktop_fluent/pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*//; s/\+.*//')"
          APP_DIR="apps/desktop_fluent/build/macos/Build/Products/Release"
          APP_PATH="$(find "$APP_DIR" -maxdepth 1 -name '*.app' -print | head -n 1)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          mkdir -p dist
          OUT="dist/AI.Studio_${VERSION}_${{ matrix.suffix }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$OUT"
          ls -lh dist/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.suffix }}
          path: dist/*.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.5"
          cache: true

      - name: Cache Android build intermediates
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile_material/android/.gradle
          key: android-gradle-${{ runner.os }}-${{ hashFiles('apps/mobile_material/android/**/*.gradle*', 'apps/mobile_material/android/**/gradle-wrapper.properties', 'apps/mobile_material/pubspec.yaml', 'packages/**/pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            android-gradle-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      - name: Build APK release (split per ABI)
        working-directory: apps/mobile_material
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        shell: bash
        run: |
          VERSION="$(grep -E '^version:' apps/mobile_material/pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*//; s/\+.*//')"
          OUT_DIR="apps/mobile_material/build/app/outputs/flutter-apk"
          mkdir -p dist
          declare -A ABI_SRC=(
            ["arm64-v8a"]="app-arm64-v8a-release.apk"
            ["armeabi-v7a"]="app-armeabi-v7a-release.apk"
            ["x86_64"]="app-x86_64-release.apk"
          )
          for abi in arm64-v8a armeabi-v7a x86_64; do
            SRC="${OUT_DIR}/${ABI_SRC[$abi]}"
            test -f "$SRC"
            cp -f "$SRC" "dist/AI.Studio_${VERSION}_${abi}.apk"
          done
          ls -lh dist/

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  # 未签名 IPA：供 Sideloadly / AltStore 等以免费或付费 Apple ID 重签安装；不进 Release。
  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.5"
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS release (no codesign)
        working-directory: apps/mobile_material
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^version:' apps/mobile_material/pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*//; s/\+.*//')"
          APP_DIR="apps/mobile_material/build/ios/iphoneos"
          APP_PATH="$(find "$APP_DIR" -maxdepth 1 -name '*.app' -print | head -n 1)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          # 侧载工具对未签名 framework 更友好：adhoc 身份轻量签一层元数据
          if [ -d "$APP_PATH/Frameworks" ]; then
            find "$APP_PATH/Frameworks" -type d -name '*.framework' \
              -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          fi
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/
          OUT="dist/AI.Studio_${VERSION}_ios.ipa"
          (
            cd dist
            zip -r9 -q "AI.Studio_${VERSION}_ios.ipa" Payload
            rm -rf Payload
          )
          test -f "$OUT"
          ls -lh "$OUT"
          unzip -l "$OUT" | head -n 20

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/*.ipa
          if-no-files-found: error
